<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>X-DAY 履歴一覧</title>
    <style>
        body { background: #181a1b; color: #f1f1f1; text-align: center; margin: 50px; font-family: 'Segoe UI', Arial, sans-serif; }
        table { margin: 0 auto; border-collapse: collapse; font-size:18px; background: #222; color: #f1f1f1; }
        th, td { padding: 8px 20px; border: 1px solid #444; }
        th { background: #333; color: #00e6e6; }
        tr:nth-child(even) { background: #181a1b; }
        .btn { font-size: 16px; padding: 6px 18px; margin: 0 4px; background: #222; color: #fff; border: 2px solid #444; border-radius: 8px; transition: background 0.2s, color 0.2s; }
        .btn:hover { background: #444; color: #00e6e6; }
        h1 { color: #00e6e6; text-shadow: 2px 2px 8px #000; }
    </style>
</head>
<body>
    <h1>X-DAY 診断履歴</h1>
    <table>
        <tr>
            <th>診断日時</th>
            <th>LP</th>
            <th>余命年数</th>
            <th>X-DAY</th>
            <th>詳細</th>
        </tr>
        {% for s in sessions %}
        <tr>
            <td>{{ s.started_at|date:"Y-m-d H:i" }}</td>
            <td>{{ s.lp_total }}</td>
            <td>{{ s.result.lifespan_years }}</td>
            <td>{{ s.result.xday_date }}</td>
            <td><a class="btn" href="{% url 'xday_history_detail' s.id %}">詳細</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="5">履歴がありません</td></tr>
        {% endfor %}
    </table>
    <form action="/xday/" method="get">
        <button class="btn" type="submit">トップへ戻る</button>
    </form>
</body>
</html>
